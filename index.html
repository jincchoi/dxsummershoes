<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Discovery Expedition — Summer Shoes (Gesture)</title>
<!--
  매장 체험형 태블릿 — 손동작 인식 버전 (세로형 / Portrait, 1200 x 2000)  · FINAL v3
  ─────────────────────────────────────────────────────────────
  · ✌ 가위 = 이전 상품 / ✊ 주먹 = 다음 상품 · 손 좌우 = 이미지 · 컬러칩 = 컬러 전환
  · 간격/위치/크기는 아래 :root 의 --변수 로 조정합니다(단위 cqw = 화면폭의 1%).
  · [v3 변경]
    1) ⚙ 조절 패널: 로고 높이 / 상단 여백 / 상품명-컬러칩 간격 실시간 조절 (현재값 복사 가능)
    2) 컬러칩 위치를 '상품명 뒤 일정 간격'(flex)으로 변경 → 상품명 길이와 무관하게 동일 간격
  [이미지/문구 교체]  PRODUCTS 배열의 colors[].imgs 경로(이 HTML 기준 상대경로)를 교체.
  [단일 파일 배포]   embed-images.bat 실행 → *_embed.html 생성(이미지 내장).
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#F4F1EA; --surface:#FFFFFF; --ink:#1B2630; --muted:#6A7079;
    --line:rgba(27,38,48,.12); --line-2:rgba(27,38,48,.22);
    --accent:#1E7FB5; --accent-soft:#DCECF5; --chip:rgba(255,255,255,.9);
    --font:"Pretendard","Pretendard Variable",-apple-system,"Noto Sans KR","Noto Sans JP","Noto Sans SC",system-ui,sans-serif;

    /* ===== 간격/위치/크기 (단위 cqw = 화면폭의 1%) ===== */
    --header-pt:2.2cqw;        /* [조절] 상단 여백 */
    --pad-x:4.5cqw;
    --logo-h:7.7cqw;           /* [조절] 브랜드 로고 높이 */
    --lang-size:2.2cqw;
    --pbar-mb:3cqw;
    --img-radius:2.5cqw;
    --counter-size:2.5cqw;
    --idots-pt:1.6cqw;
    --info-h:30.6cqw;          /* [조절] 정보영역 높이 */
    --tags-top:2.8cqw;
    --badge-size:2.1cqw;
    --name-top:5.7cqw;
    --name-size:4.5cqw;
    --price-size:3.6cqw;
    --name-chip-gap:5.0cqw;    /* [조절] 상품명 ↔ 컬러칩 간격 (모든 상품 동일) */
    --chips-gap:2.2cqw;
    --chip-d:3.5cqw;
    --ensub-top:14.0cqw;       /* [조절] 영문서브 위치 */
    --ensub-size:2.3cqw;
    --desc-top:18.6cqw;        /* [조절] 설명문 위치 */
    --desc-size:2.6cqw;
    --spec-top:24.6cqw;        /* [조절] 스펙/구분선 위치 */
    --spec-size:2.1cqw;
    --hint-size:2.1cqw;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:#000;overflow:hidden;font-family:var(--font);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #frame{height:100dvh;aspect-ratio:1200/2000;max-width:100vw;margin:0 auto;position:relative;
    background:var(--bg);container-type:inline-size;overflow:hidden}
  #app{position:absolute;inset:0;display:flex;flex-direction:column}

  header{display:flex;align-items:center;justify-content:space-between;padding:var(--header-pt) var(--pad-x) 1cqw;flex:0 0 auto}
  /* 로고 PNG 좌측 여백(폭의 6.73%) 보정 → 로고 시작점을 이미지 좌측 끝선과 정렬 (로고 높이에 비례) */
  .brand-logo{height:var(--logo-h);width:auto;display:block;margin-left:calc(var(--logo-h) * -0.2427)}
  .langs{display:flex;gap:1.2cqw}
  .lang{font-family:var(--font);font-size:var(--lang-size);color:var(--muted);background:transparent;
    border:0.12cqw solid var(--line-2);border-radius:3cqw;padding:1.4cqw 2.8cqw;cursor:pointer;line-height:1}
  .lang.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  #content{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;padding:0 var(--pad-x);will-change:transform}
  .pbar{display:flex;gap:1.5cqw;padding:0 0 var(--pbar-mb);flex:0 0 auto}
  .seg{flex:1;height:0.85cqw;border-radius:1cqw;background:var(--line-2);border:0;padding:0;cursor:pointer;transition:background .25s}
  .seg.on{background:var(--accent)}

  .stage{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
  .viewport{position:relative;height:100%;width:100%;border-radius:var(--img-radius);overflow:hidden;background:#E6E8E6}
  .track{display:flex;height:100%;will-change:transform}
  .cell{flex:0 0 auto;height:100%;position:relative;overflow:hidden;background:#E6E8E6}
  .cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  /* 모델컷: 같은 이미지를 흐리게 확대해 배경을 채우고(bgblur), 원본은 잘림 없이 전체 표시(fg/contain) */
  .cell img.bgblur{object-fit:cover;filter:blur(1.8cqw) saturate(1.08);transform:scale(1.12);z-index:0}
  .cell img.fg{object-fit:contain;z-index:1}
  .phl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1cqw;color:#3A332C}
  .phl .pn{font-size:5cqw;font-weight:700;opacity:.5;letter-spacing:.1cqw}
  .phl .pv{font-size:2.8cqw;opacity:.45;text-transform:uppercase;letter-spacing:.4cqw}
  .ov{position:absolute;z-index:2;pointer-events:none}
  .counter{top:2.6cqw;right:2.6cqw;background:var(--chip);color:var(--ink);font-size:var(--counter-size);padding:1cqw 2.4cqw;border-radius:6cqw}

  .idots{display:flex;gap:1.4cqw;justify-content:center;padding:var(--idots-pt) 0 0.4cqw;flex:0 0 auto}
  .idot{width:1.5cqw;height:1.5cqw;border-radius:50%;background:var(--line-2);border:0;padding:0;cursor:pointer}
  .idot.on{width:5cqw;border-radius:.8cqw;background:var(--accent)}

  /* ===== 정보 영역 : 고정 레이아웃(언어 무관 동일 위치) ===== */
  .info{flex:0 0 auto;position:relative;height:var(--info-h);padding:1cqw 1cqw 0}
  .tags{position:absolute;top:var(--tags-top);left:1cqw;display:flex;gap:1.2cqw;align-items:center}
  .badge{display:inline-flex;align-items:center;justify-content:center;font-size:var(--badge-size);line-height:1;padding:0.8cqw 2cqw 0.64cqw;border-radius:2cqw}
  .badge.main{background:var(--accent);color:#fff}
  .badge.sub{background:var(--accent-soft);color:var(--accent)}
  .pno{display:inline-flex;align-items:center;justify-content:center;font-size:calc(var(--badge-size) - 0.1cqw);line-height:1;padding:0.75cqw 1.8cqw 0.59cqw;border-radius:2cqw;border:0.12cqw solid var(--line-2);color:var(--muted);letter-spacing:.06cqw}

  /* nrow : [상품명 — 컬러칩] 좌측 그룹 + 가격 우측 (상품명-칩 간격 고정) */
  .nrow{position:absolute;top:var(--name-top);left:1cqw;right:1cqw;height:7cqw;display:flex;align-items:flex-end;justify-content:space-between;gap:2cqw}
  .nleft{display:flex;align-items:center;gap:var(--name-chip-gap);min-width:0}
  .name{font-size:var(--name-size);font-weight:700;color:var(--ink);letter-spacing:-.05cqw;white-space:nowrap;line-height:1}
  .price{font-size:var(--price-size);font-weight:600;color:var(--ink);white-space:nowrap;line-height:1;flex:0 0 auto}
  .chips{display:flex;gap:var(--chips-gap);align-items:center;flex:0 0 auto}
  .chip-b{width:var(--chip-d);height:var(--chip-d);border-radius:50%;border:0.2cqw solid var(--line-2);padding:0;cursor:pointer;
    transition:box-shadow .15s,transform .12s;background-clip:padding-box}
  .chip-b:active{transform:scale(.9)}
  .chip-b.on{box-shadow:0 0 0 0.6cqw var(--surface),0 0 0 1.05cqw var(--accent)}

  .ensub{position:absolute;top:var(--ensub-top);left:1cqw;right:1cqw;height:3.6cqw;overflow:hidden;
    font-size:var(--ensub-size);color:var(--accent);letter-spacing:.02cqw;white-space:nowrap;text-overflow:ellipsis}
  .desc{position:absolute;top:var(--desc-top);left:1cqw;right:1cqw;height:calc(var(--spec-top) - var(--desc-top) - 0.6cqw);overflow:hidden;
    font-size:var(--desc-size);line-height:1.45;color:var(--ink)}
  .spec{position:absolute;top:var(--spec-top);left:1cqw;right:1cqw;padding-top:1.2cqw;border-top:0.12cqw solid var(--line);
    font-size:var(--spec-size);color:var(--muted)}

  .hint{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:2cqw;color:var(--muted);font-size:var(--hint-size);padding:1cqw 0 1.6cqw;transition:opacity .4s}

  /* 카메라 미리보기 + 손동작 상태 */
  .cam{position:absolute;left:6cqw;top:18cqw;width:19cqw;aspect-ratio:3/4;border-radius:2.4cqw;overflow:hidden;background:#111;z-index:6;border:0.2cqw solid var(--line-2);display:none}
  .cam.on{display:block}
  .cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .cam canvas{position:absolute;inset:0;width:100%;height:100%}
  .cam .clbl{position:absolute;top:1cqw;left:1cqw;font-size:1.9cqw;color:#fff;background:rgba(0,0,0,.45);padding:.4cqw 1.4cqw;border-radius:3cqw}
  .flash{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);z-index:7;font-size:9cqw;color:var(--accent);
    opacity:0;pointer-events:none;font-weight:700}
  .flash.go{animation:pop .55s ease}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}30%{opacity:.95}100%{opacity:0;transform:translate(-50%,-50%) scale(1.25)}}

  #overlay{position:absolute;inset:0;z-index:20;background:rgba(18,40,56,.94);color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.5cqw;text-align:center;padding:9cqw}
  #overlay h1{font-size:5cqw;font-weight:700;margin:0}
  #overlay p{font-size:3cqw;color:#e8e3da;margin:0;line-height:1.6}
  #start{font-family:var(--font);font-size:3.4cqw;font-weight:600;color:#fff;background:var(--accent);
    border:0;border-radius:3cqw;padding:3cqw 8cqw;cursor:pointer;margin-top:2cqw}
  .ghand{font-size:9cqw;animation:wave 1.6s ease-in-out infinite}
  @keyframes wave{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
  @media(prefers-reduced-motion:reduce){.ghand{animation:none}}

  /* ===== ⚙ 실시간 조절 패널 (배포 시 닫아두면 됨) ===== */
  #ctrlToggle{position:fixed;top:12px;right:12px;z-index:50;width:42px;height:42px;border-radius:50%;
    border:0;background:rgba(33,31,27,.85);color:#fff;font-size:20px;cursor:pointer;line-height:1;
    box-shadow:0 2px 10px rgba(0,0,0,.25)}
  #ctrl{position:fixed;top:60px;right:12px;z-index:50;width:280px;max-width:80vw;
    background:rgba(255,255,255,.97);border:1px solid rgba(33,31,27,.15);border-radius:14px;
    box-shadow:0 8px 30px rgba(0,0,0,.22);padding:14px 16px;font-family:var(--font);color:#211F1B;display:none}
  #ctrl.open{display:block}
  #ctrl h3{margin:0 0 10px;font-size:14px;font-weight:700}
  .cg{margin-bottom:12px}
  .cg label{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:5px}
  .cg label b{color:var(--accent);font-weight:700}
  .cg input[type=range]{width:100%;accent-color:var(--accent)}
  #ctrlCss{width:100%;font-size:11px;font-family:ui-monospace,Menlo,Consolas,monospace;color:#444;
    background:#F2EEE6;border:1px solid rgba(33,31,27,.12);border-radius:8px;padding:8px;resize:none;line-height:1.5}
  .cbtns{display:flex;gap:8px;margin-top:8px}
  .cbtns button{flex:1;font-family:var(--font);font-size:12px;font-weight:600;padding:8px;border-radius:8px;cursor:pointer;border:0}
  #ctrlCopy{background:var(--accent);color:#fff}
  #ctrlReset{background:#E5E0D6;color:#211F1B}
</style>
</head>
<body>
<div id="frame">
  <div id="app">
    <header>
      <img class="brand-logo" src="LOGO_gREY-01.png" alt="Discovery Expedition">
      <div class="langs" id="langs"></div>
    </header>
    <div id="content">
      <div class="pbar" id="pbar"></div>
      <div class="stage" id="stage">
        <div class="viewport" id="ivp">
          <div class="track" id="track"></div>
          <div class="ov counter" id="counter"></div>
        </div>
        <div class="flash" id="flash"></div>
      </div>
      <div class="idots" id="idots"></div>
      <div class="info" id="info"></div>
    </div>
    <div class="hint" id="hint"></div>
    <div class="cam" id="cam"><video id="video" playsinline muted></video><canvas id="cv"></canvas><div class="clbl" id="clbl">손 인식</div></div>
  </div>
  <div id="overlay">
    <div class="ghand">&#128075;</div>
    <h1>손으로 둘러보세요</h1>
    <p>✌ 가위 = 이전 신발 · ✊ 주먹 = 다음 신발<br>손을 좌우로 휙 움직이면 이미지가 넘어가요.<br>(화면 터치 · 컬러칩으로도 이용할 수 있어요)</p>
    <button id="start">시작하기</button>
  </div>
</div>

<!-- ⚙ 실시간 조절 패널 -->
<button id="ctrlToggle" title="조절 패널">&#9881;</button>
<div id="ctrl">
  <h3>실시간 조절</h3>
  <div class="cg">
    <label>상단 여백 <b id="v-header-pt"></b></label>
    <input type="range" id="r-header-pt" min="0" max="15" step="0.1">
  </div>
  <div class="cg">
    <label>로고 높이 <b id="v-logo-h"></b></label>
    <input type="range" id="r-logo-h" min="2" max="12" step="0.1">
  </div>
  <div class="cg">
    <label>상품명 ↔ 컬러칩 간격 <b id="v-name-chip-gap"></b></label>
    <input type="range" id="r-name-chip-gap" min="0" max="14" step="0.1">
  </div>
  <div class="cg">
    <label>영문서브 위치 <b id="v-ensub-top"></b></label>
    <input type="range" id="r-ensub-top" min="8" max="22" step="0.1">
  </div>
  <div class="cg">
    <label>설명문 위치 <b id="v-desc-top"></b></label>
    <input type="range" id="r-desc-top" min="10" max="26" step="0.1">
  </div>
  <div class="cg">
    <label>스펙/구분선 위치 <b id="v-spec-top"></b></label>
    <input type="range" id="r-spec-top" min="18" max="36" step="0.1">
  </div>
  <div class="cg">
    <label>정보영역 높이 <b id="v-info-h"></b></label>
    <input type="range" id="r-info-h" min="24" max="42" step="0.1">
  </div>
  <textarea id="ctrlCss" rows="8" readonly></textarea>
  <div class="cbtns">
    <button id="ctrlCopy">현재값 복사</button>
    <button id="ctrlReset">초기화</button>
  </div>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18";

/* ===== 손동작 민감도 설정 ===== */
const CONFIG={ POSE_FRAMES:6, COOLDOWN_MS:1200, SWIPE_TH:0.13, SWIPE_MS:260, SWIPE_INVERT:true };

/* ===== 다국어 라벨 ===== */
const T={
  kr:{lang:"한국어",hint:"✌ 가위 = 이전 · ✊ 주먹 = 다음 · 손 좌우 = 이미지"},
  en:{lang:"EN",hint:"✌ prev · ✊ next · hand ←→ = image"},
  cn:{lang:"中文",hint:"✌ 上一个 · ✊ 下一个 · 手左右 = 图片"},
  jp:{lang:"日本語",hint:"✌ 前へ · ✊ 次へ · 手 左右 = 画像"}
};
const F={best:{kr:"베스트",en:"Best",cn:"热卖",jp:"ベスト"},new:{kr:"26SS 신상품",en:"26SS New",cn:"26SS 新品",jp:"26SS NEW"}};
const VIEW={model:{kr:"모델컷",en:"Model",cn:"模特",jp:"モデル"},product:{kr:"제품컷",en:"Product",cn:"产品",jp:"製品"}};
const SPEC={wt:{kr:"무게",en:"Weight",cn:"重量",jp:"重さ"},hl:{kr:"굽 높이",en:"Heel",cn:"跟高",jp:"ヒール高"}};

/* 이미지 묶음 헬퍼 — 모델컷 → 제품컷 순서로 결합 */
const mk=(model,product)=>[
  ...model.map(src=>({view:"model",src})),
  ...product.map(src=>({view:"product",src}))
];

/* ===== 콘텐츠 — 폴더 순서(웨이브제인 → 웨이브샌디) ===== */
const PRODUCTS=[
  {nameKr:"웨이브 제인",nameEn:"Wave Jane",code:"DXSH7275N",flag:"best",price:"₩99,000",weight:"234g",heel:"3.5cm",
   tag:{kr:"베스트 액티브 메리제인",en:"Best active Mary Jane",cn:"人气 active 玛丽珍",jp:"人気アクティブメリージェーン"},
   desc:{kr:"곡선적 형태감이 돋보이는 디스커버리 베스트 액티브 메리제인 스니커즈",en:"Discovery's best-selling active Mary Jane sneaker with a sculpted silhouette",cn:"曲线轮廓出众的 Discovery 人气运动玛丽珍运动鞋",jp:"曲線的なシルエットが際立つ、ディスカバリー人気のアクティブメリージェーンスニーカー"},
   colors:[
     {code:"BDS",name:{kr:"버건디",en:"Burgundy"},chip:"#6B3A44",imgs:mk(
       ["1) 웨이브제인/01)BDS/01) 모델컷.jpg","1) 웨이브제인/01)BDS/02) 모델컷.jpg"],
       ["1) 웨이브제인/01)BDS/03) 제품컷.png","1) 웨이브제인/01)BDS/04) 제품컷.jpg","1) 웨이브제인/01)BDS/05) 제품컷.jpg","1) 웨이브제인/01)BDS/06) 제품컷.jpg"])},
     {code:"RDS",name:{kr:"레드",en:"Red"},chip:"#C0202B",imgs:mk(
       [],
       ["1) 웨이브제인/02)RDS/DXSH7275N-RDS_02_MS.png","1) 웨이브제인/02)RDS/DXSH7275N-RDS_12_S.jpg","1) 웨이브제인/02)RDS/DXSH7275N-RDS_13_S.jpg","1) 웨이브제인/02)RDS/DXSH7275N-RDS_15_S.jpg"])},

/* ===== 갤러리 ===== */
let shoe=0,colorIdx=0,img=0,lang="kr",axis=null,drag=false,x0=0,y0=0,dx=0,dy=0,IW=0;
const $=id=>document.getElementById(id);
const stage=$("stage"),ivp=$("ivp"),track=$("track"),content=$("content");
const curColor=()=>PRODUCTS[shoe].colors[colorIdx];

function renderLangs(){$("langs").innerHTML=["kr","en","cn","jp"].map(l=>`<button class="lang ${l===lang?"on":""}" onclick="setLang('${l}')">${T[l].lang}</button>`).join("");}
function buildTrack(){const p=PRODUCTS[shoe],c=curColor();
  track.innerHTML=c.imgs.map(im=>{const src=encodeURI(im.src);
    const alt=`${p.nameEn} ${c.code} ${VIEW[im.view][lang]}`;
    const phl=`<div class="phl"><span class="pn">${p.nameEn}</span><span class="pv">${VIEW[im.view][lang]}</span></div>`;
    // 모델컷·제품컷 모두 4:5 비율 적용 완료 → 별도 가공 없이 그대로 cover
    // PNG(투명 배경 가능)는 셀에 화이트 배경을 깔고, 투명영역으로 비치는 플레이스홀더 텍스트는 숨김
    const isPng=/\.png(\?|$)/i.test(im.src);
    const cellBg=isPng?' style="background:#fff"':'';
    return `<div class="cell"${cellBg}>${isPng?'':phl}<img src="${src}" alt="${alt}" onerror="this.remove()"></div>`;}).join("");
  size();updateOv();}
function updateOv(){const c=curColor();$("counter").textContent=(img+1)+" / "+c.imgs.length;}
function renderInfo(){const p=PRODUCTS[shoe],fb=F[p.flag][lang],c=curColor();
  const nm=lang==="kr"?p.nameKr:p.nameEn;
  const chips=p.colors.map((co,k)=>`<button class="chip-b ${k===colorIdx?"on":""}" style="background:${co.chip}" onclick="setColor(${k})" aria-label="${co.name.en}"></button>`).join("");
  $("info").innerHTML=
    `<div class="tags"><span class="badge ${p.flag==="best"?"main":"sub"}">${fb}</span><span class="pno">${p.code}</span></div>`+
    `<div class="nrow"><div class="nleft"><span class="name">${nm}</span><span class="chips">${chips}</span></div><span class="price">${p.price}</span></div>`+
    `<div class="ensub">${p.nameEn.toUpperCase()} · ${p.tag[lang]}</div>`+
    `<div class="desc">${p.desc[lang]}</div>`+
    `<div class="spec">${SPEC.wt[lang]} ${p.weight} · ${SPEC.hl[lang]} ${p.heel}</div>`;}
function renderIdots(){const c=curColor();$("idots").innerHTML=c.imgs.map((im,k)=>`<button class="idot ${k===img?"on":""}" onclick="imgDot(${k})" aria-label="${k+1}"></button>`).join("");}
function renderPbar(){$("pbar").innerHTML=PRODUCTS.map((p,i)=>`<button class="seg ${i===shoe?"on":""}" onclick="shoeJump(${i})" aria-label="${p.nameEn}"></button>`).join("");}
function renderHint(){$("hint").innerHTML=`<span>${T[lang].hint}</span>`;}
function size(){IW=ivp.clientWidth;[...track.children].forEach(c=>c.style.width=IW+"px");place(false);}
function place(a){track.style.transition=a?"transform .3s ease":"none";track.style.transform=`translateX(${-img*IW+(axis==="x"?dx:0)}px)`;}
function dim(){$("hint").style.opacity=".4";}
function setImg(n){const len=curColor().imgs.length;img=Math.max(0,Math.min(len-1,n));place(true);renderIdots();updateOv();dim();resetIdle();}
function setColor(k){const p=PRODUCTS[shoe];k=Math.max(0,Math.min(p.colors.length-1,k));if(k===colorIdx)return;
  colorIdx=k;img=0;renderInfo();buildTrack();renderIdots();dim();resetIdle();}
function shoeStep(d){const ns=Math.max(0,Math.min(PRODUCTS.length-1,shoe+d));const dir=Math.sign(d)||1;
  if(ns===shoe){content.style.transition="transform .25s ease";content.style.transform="translateY(0)";content.style.opacity="1";return;}
  shoe=ns;colorIdx=0;img=0;renderInfo();buildTrack();renderIdots();renderPbar();dim();resetIdle();
  content.style.transition="none";content.style.transform=`translateY(${dir*4}cqw)`;content.style.opacity=".4";
  requestAnimationFrame(()=>{content.style.transition="transform .3s ease, opacity .3s ease";content.style.transform="translateY(0)";content.style.opacity="1";});}
window.setLang=l=>{lang=l;renderLangs();renderHint();buildTrack();renderInfo();renderIdots();resetIdle();};
window.setColor=k=>setColor(k);
window.shoeBtn=d=>shoeStep(d);
window.shoeJump=i=>shoeStep(i-shoe);
window.imgDot=k=>setImg(k);

/* 터치 스와이프 = 이미지(좌우)만 */
stage.addEventListener("pointerdown",e=>{drag=true;axis=null;x0=e.clientX;y0=e.clientY;dx=0;dy=0;});
stage.addEventListener("pointermove",e=>{if(!drag)return;dx=e.clientX-x0;dy=e.clientY-y0;
  if(!axis&&(Math.abs(dx)>7||Math.abs(dy)>7))axis=Math.abs(dx)>=Math.abs(dy)?"x":"y";
  if(axis==="x")place(false);});
function endPtr(){if(!drag)return;drag=false;
  if(axis==="x"){const th=IW*0.15;let n=img;if(dx<-th)n++;else if(dx>th)n--;setImg(n);}
  axis=null;resetIdle();}
stage.addEventListener("pointerup",endPtr);stage.addEventListener("pointercancel",endPtr);stage.addEventListener("pointerleave",endPtr);

/* 무조작 45초 → 처음으로 */

/* 손동작으로 동작 실행 */
function flash(txt){const f=$("flash");f.textContent=txt;f.classList.remove("go");void f.offsetWidth;f.classList.add("go");}
function gestureImage(dir){setImg(img+dir);flash(dir>0?"›":"‹");}
function gestureProduct(dir){shoeStep(dir);flash(dir>0?"✊":"✌");}

/* 초기 렌더 */
renderLangs();renderHint();renderInfo();buildTrack();renderIdots();renderPbar();resetIdle();

/* ===== MediaPipe 손 추적 ===== */
const video=$("video"),cv=$("cv"),ctx=cv.getContext("2d");
let landmarker=null, hist=[], cooldownUntil=0;

async function initHand(){
  const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm");
  landmarker=await HandLandmarker.createFromOptions(vision,{
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate:"GPU"},
    runningMode:"VIDEO",numHands:1});
}
async function startCamera(){
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:480,height:640}});
  video.srcObject=stream; await video.play();
  $("cam").classList.add("on");
  cv.width=video.videoWidth||480; cv.height=video.videoHeight||640;
  requestAnimationFrame(loop);
}
function loop(){
  if(landmarker&&video.readyState>=2){
    const res=landmarker.detectForVideo(video,performance.now());
    handle(res);
    draw(res);
  }
  requestAnimationFrame(loop);
}
function fingersUp(lm){const ext=i=>lm[i].y<lm[i-2].y;return [ext(8),ext(12),ext(16),ext(20)];}
function classify(lm){const f=fingersUp(lm);const up=f.filter(Boolean).length;
  if(up===0)return "fist";
  if(f[0]&&f[1]&&!f[2]&&!f[3])return "scissors";
  return null;}
let poseHold=null,poseCount=0,mhist=[];
function handle(res){
  const now=performance.now();
  if(!res||!res.landmarks||!res.landmarks.length){poseHold=null;poseCount=0;mhist=[];$("clbl").textContent="손을 보여주세요";return;}
  const lm=res.landmarks[0];
  const g=classify(lm);
  $("clbl").textContent = g==="fist"?"✊ 다음":(g==="scissors"?"✌ 이전":"✋ 좌우 = 이미지");
  if(now<cooldownUntil)return;
  if(g){
    mhist=[];
    if(g===poseHold)poseCount++; else {poseHold=g;poseCount=1;}
    if(poseCount>=CONFIG.POSE_FRAMES){gestureProduct(g==="fist"?1:-1);cooldownUntil=now+CONFIG.COOLDOWN_MS;poseHold=null;poseCount=0;}
  } else {
    poseHold=null;poseCount=0;
    mhist.push({x:lm[9].x,t:now});
    while(mhist.length&&now-mhist[0].t>CONFIG.SWIPE_MS)mhist.shift();
    if(mhist.length>=2){
      const dx=mhist[mhist.length-1].x-mhist[0].x;
      if(Math.abs(dx)>=CONFIG.SWIPE_TH){
        let dir=dx>0?1:-1; if(CONFIG.SWIPE_INVERT)dir=-dir;
        gestureImage(dir);cooldownUntil=now+CONFIG.COOLDOWN_MS;mhist=[];
      }
    }
  }
}
function draw(res){
  ctx.clearRect(0,0,cv.width,cv.height);
  if(!res||!res.landmarks||!res.landmarks.length)return;
  const lm=res.landmarks[0][9];
  ctx.beginPath();ctx.arc((1-lm.x)*cv.width,lm.y*cv.height,Math.max(6,cv.width*0.03),0,7);
  ctx.fillStyle="rgba(30,127,181,.9)";ctx.fill();
}

/* 시작 버튼: 카메라 권한 요청 → 실패 시 터치 전용 */
$("start").addEventListener("click",async()=>{
  $("overlay").style.display="none";
  try{ await initHand(); await startCamera(); }
  catch(err){ console.warn("gesture disabled:",err); $("cam").classList.remove("on"); }
});

  // [var, 기본값(cqw)] — 슬라이더 id는 r-header-pt / 값표시 id는 v-header-pt 형태
  const DEFAULTS={ "--header-pt":2.2, "--logo-h":7.7, "--name-chip-gap":5.0, "--ensub-top":14.0, "--desc-top":18.6, "--spec-top":24.6, "--info-h":30.6 };
  const KEYS=Object.keys(DEFAULTS);
  const rId=k=>"r"+k.replace("--","-");
  const vId=k=>"v"+k.replace("--","-");

  function refreshOut(){
    const lines=KEYS.map(k=>`    ${k}:${(+document.getElementById(rId(k)).value).toFixed(1)}cqw;`);
    document.getElementById("ctrlCss").value=lines.join("\n");
  }
  function bind(key){
    const r=document.getElementById(rId(key)), v=document.getElementById(vId(key));
    const set=val=>{ r.value=val; v.textContent=(+val).toFixed(1)+"cqw"; root.style.setProperty(key, val+"cqw"); refreshOut(); };
    r.addEventListener("input",()=>set(r.value));
    set(DEFAULTS[key]);
  }
  KEYS.forEach(bind);

  document.getElementById("ctrlToggle").addEventListener("click",()=>{
    document.getElementById("ctrl").classList.toggle("open");
  });
  document.getElementById("ctrlReset").addEventListener("click",()=>{
    KEYS.forEach(k=>{ const r=document.getElementById(rId(k)); r.value=DEFAULTS[k]; r.dispatchEvent(new Event("input")); });
  });
  document.getElementById("ctrlCopy").addEventListener("click",async()=>{
    const t=document.getElementById("ctrlCss"); t.select();
    try{ await navigator.clipboard.writeText(t.value); }catch(e){ document.execCommand("copy"); }
    const b=document.getElementById("ctrlCopy"); const o=b.textContent; b.textContent="복사됨!"; setTimeout(()=>b.textContent=o,1200);
  });
})();
</script>
</body>
</html>
